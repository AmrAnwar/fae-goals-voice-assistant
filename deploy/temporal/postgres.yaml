# PostgreSQL for Temporal.
#
# The Temporal Helm chart (v1.8+) no longer bundles a database, so this
# StatefulSet provides one for the local minikube cluster. The `temporal` user
# is a superuser, which lets the chart's schema job create the `temporal` and
# `temporal_visibility` databases on first install.
#
# The password is deliberately absent from this file. scripts/temporal-up.sh
# creates the `temporal-postgres` Secret once and reuses it on every run. To
# rotate the password you must also recreate the data volume, because the
# password is stored inside PostgreSQL on first initialisation.
apiVersion: v1
kind: Service
metadata:
  name: temporal-postgres
  namespace: temporal
  labels:
    app.kubernetes.io/name: temporal-postgres
    app.kubernetes.io/instance: temporal
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: temporal
    app.kubernetes.io/managed-by: kubectl
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: temporal-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: temporal-postgres
  namespace: temporal
  labels: &labels
    app.kubernetes.io/name: temporal-postgres
    app.kubernetes.io/instance: temporal
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: temporal
    app.kubernetes.io/managed-by: kubectl
spec:
  serviceName: temporal-postgres
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    # Immutable. Keep this selector stable and add new labels to the pod
    # template; changing it would require deleting and recreating the
    # StatefulSet.
    matchLabels:
      app.kubernetes.io/name: temporal-postgres
  template:
    metadata:
      labels: *labels
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        # The alpine postgres image ships the postgres user as uid/gid 70.
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16.15-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: temporal
            - name: POSTGRES_DB
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: temporal-postgres
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          # Give initdb room on a slow first start, then switch to the normal
          # readiness/liveness pair. Startup probes disable both until they
          # pass, so a long first boot is not mistaken for a crash loop.
          startupProbe:
            exec:
              command: ["pg_isready", "-U", "temporal", "-d", "postgres"]
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "temporal", "-d", "postgres"]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "temporal", "-d", "postgres"]
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
